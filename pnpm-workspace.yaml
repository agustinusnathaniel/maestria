packages:
  - apps/*
  - packages/*
  - packages/shared/**
  - tools/*

catalogMode: prefer

catalog:
  '@types/node': ^26.2.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.11
  vite-plus: 0.2.9
  '@changesets/cli': ^3.0.1
  '@changesets/changelog-github': ^1.0.0
  '@fontsource-variable/alan-sans': ^5.3.0
  '@fontsource-variable/sn-pro': ^5.3.0
  '@earendil-works/pi-coding-agent': '^0.84.2'
  '@gotgenes/pi-subagents': '^19.3.4'
  effect: 4.0.0-rc.111
  jsonc-parser: ^3.3.1
  'typebox': '*'
  '@astrojs/starlight': ^0.41.7
  astro: 7.2.4
  all-contributors-cli: ^6.26.1
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@astrojs/starlight-tailwind': ^5.0.0
  tsx: 4.23.12
  yaml: ^2.9.0
  '@astrojs/check': ^0.9.10
  sharp: 0.35.3
  astro-contributors: ^0.9.0
  starlight-auto-sidebar: ^0.4.0
  starlight-links-validator: ^0.25.3
  starlight-llms-txt: ^0.11.0
  starlight-package-managers: ^0.12.0
  starlight-page-actions: ^0.7.1
  '@clack/prompts': ^1.7.0
  citty: ^0.2.2
  picocolors: ^1.1.1
  '@clack/core': ^1.4.3
  '@types/diff': ^8.0.0
  diff: ^9.0.0
  '@opencode-ai/plugin': ^1.18.19
  es-toolkit: ^1.51.0
  zod: ^4.4.3
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
  # keep vitest's browser peer aligned with the catalog-pinned vitest (vite-plus bundles 4.1.10)
  '@vitest/browser-preview': 4.1.11
  # Dependency-security pins (pnpm 11: overrides live in pnpm-workspace.yaml)
  # GHSA-mh99-v99m-4gvg (brace-expansion DoS) via minimatch 10.2.5 -> 5.0.6; 10.2.6 declares ^5.0.8
  minimatch: 10.2.6
  # js-yaml quadratic merge-key DoS (GHSA-2v9j-7w3m-84pc, GHSA-2p99-v8mh-m8w8): 4.x chain + 3.x chain via read-yaml-file
  js-yaml: 4.3.1
  'read-yaml-file>js-yaml': 3.15.1
  # protobufjs infinite-loop DoS (GHSA-4f6p-2m5m-v7xg)
  protobufjs: 7.6.5
  # svgo removeScripts executable-script left behind (GHSA-g4vv-4v2v-9wqh)
  svgo: 4.0.2
  # fast-uri host confusion (GHSA-3q8p-8q5v-9g9q, GHSA-5r9g-8p4r-8m4w, GHSA-7p8r-x3mc-p8w7)
  # GHSA-7p8r-x3mc-p8w7 (backslash authority introducer) requires >=3.1.5; 3.1.4 was insufficient
  fast-uri: 3.1.5
  # yaml stack overflow via deeply nested collections (GHSA-2c3x-5r88-7gxh); yaml-language-server pins 2.7.1 exactly
  'yaml-language-server>yaml': 2.9.0
  # tmp path traversal via unsanitized prefix/postfix (GHSA-83rp-98q9-gj7v); only consumer is external-editor (tmpNameSync)
  tmp: 0.2.7
  # adm-zip crafted ZIP 4GB memory (GHSA-4f6p-2m5m-v7xg) and sharp libvips CVEs (GHSA-f88m-g3jw-g9cj)
  # — deep in @oh-my-pi/pi-coding-agent host runtime; omp imports it type-only so workspace gates verify safety
  adm-zip: 0.6.0
  sharp: 0.35.3
  # nanoid predictable value DoS (GHSA-2v37-7h3g-55p8): <3.3.18 via postcss in docs app
  nanoid: 3.3.18
  # undici cookie injection / cache-control parsing / retry desync / CRLF injection
  # (GHSA-v3r7-h72x-cjcm, GHSA-4cwx-7wf7-3272, GHSA-8xcm-r25x-g524, GHSA-m8rv-5g2x-5cg5, GHSA-jr45-8vmc-qm54)
  # — via @earendil-works/pi-coding-agent and @gotgenes/pi-subagents (pi runtime, not type-only)
  undici: 8.9.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
    # @astrojs/check declares ^5||^6 but TS 7 verified working (typecheck + astro build pass)
    typescript: '*'
allowBuilds:
  '@google/genai': true
  esbuild: true
  msgpackr-extract: false
  onnxruntime-node: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - '@astrojs/*'
  - astro
  - effect
