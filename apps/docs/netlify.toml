[build]
command = "pnpm --filter @maestria/docs build"
publish = "dist"

# The shared plugin host guides moved under /agent-plugins/<host>/.
[[redirects]]
from = "/claude-code"
to = "/agent-plugins/claude-code/"
status = 301

[[redirects]]
from = "/claude-code/*"
to = "/agent-plugins/claude-code/:splat"
status = 301

[[redirects]]
from = "/claude-code.md"
to = "/agent-plugins/claude-code.md"
status = 301

[[redirects]]
from = "/codex"
to = "/agent-plugins/codex/"
status = 301

[[redirects]]
from = "/codex/*"
to = "/agent-plugins/codex/:splat"
status = 301

[[redirects]]
from = "/codex.md"
to = "/agent-plugins/codex.md"
status = 301

[[redirects]]
from = "/cursor"
to = "/agent-plugins/cursor/"
status = 301

[[redirects]]
from = "/cursor/*"
to = "/agent-plugins/cursor/:splat"
status = 301

[[redirects]]
from = "/cursor.md"
to = "/agent-plugins/cursor.md"
status = 301

[[redirects]]
from = "/kimi-code"
to = "/agent-plugins/kimi-code/"
status = 301

[[redirects]]
from = "/kimi-code/*"
to = "/agent-plugins/kimi-code/:splat"
status = 301

[[redirects]]
from = "/kimi-code.md"
to = "/agent-plugins/kimi-code.md"
status = 301

[[redirects]]
from = "/hermes"
to = "/agent-plugins/hermes/"
status = 301

[[redirects]]
from = "/hermes/*"
to = "/agent-plugins/hermes/:splat"
status = 301

[[redirects]]
from = "/hermes.md"
to = "/agent-plugins/hermes.md"
status = 301

[[redirects]]
from = "/omp"
to = "/agent-plugins/omp/"
status = 301

[[redirects]]
from = "/omp/*"
to = "/agent-plugins/omp/:splat"
status = 301

[[redirects]]
from = "/omp.md"
to = "/agent-plugins/omp.md"
status = 301

# The former combined /pi-omp/ guides are now Pi-only; OMP has its own plugin guide.
[[redirects]]
from = "/pi-omp"
to = "/pi/"
status = 301

[[redirects]]
from = "/pi-omp/*"
to = "/pi/:splat"
status = 301

[[redirects]]
from = "/pi-omp.md"
to = "/pi.md"
status = 301

# The former /agent-plugin/ doc section was renamed to /agent-plugins/.
[[redirects]]
from = "/agent-plugin"
to = "/agent-plugins/"
status = 301

[[redirects]]
from = "/agent-plugin/"
to = "/agent-plugins/"
status = 301

[[redirects]]
from = "/agent-plugin/compatibility"
to = "/agent-plugins/compatibility/"
status = 301

[[redirects]]
from = "/agent-plugin/compatibility/"
to = "/agent-plugins/compatibility/"
status = 301

[[redirects]]
from = "/agent-plugin.md"
to = "/agent-plugins.md"
status = 301

[[redirects]]
from = "/agent-plugin/compatibility.md"
to = "/agent-plugins/compatibility.md"
status = 301

[build.environment]
NODE_VERSION = "24"
COREPACK_INTEGRITY_KEYS = "0"

[dev]
command = "pnpm --filter @maestria/docs dev"
port = 4321

[[headers]]
for = "/*"
[headers.values]
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' umami.sznm.dev static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com https://raw.githubusercontent.com; font-src 'self'; connect-src 'self' https://umami.sznm.dev https://static.cloudflareinsights.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"
