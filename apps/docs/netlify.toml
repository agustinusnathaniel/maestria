[build]
command = "pnpm --filter @maestria/docs build"
publish = "dist"

# The former /pi/ and /omp/ doc sections were consolidated into /pi-omp/.
[[redirects]]
from = "/pi"
to = "/pi-omp/"
status = 301

[[redirects]]
from = "/pi/"
to = "/pi-omp/"
status = 301

[[redirects]]
from = "/omp"
to = "/pi-omp/"
status = 301

[[redirects]]
from = "/omp/"
to = "/pi-omp/"
status = 301

[[redirects]]
from = "/pi.md"
to = "/pi-omp.md"
status = 301

[[redirects]]
from = "/omp.md"
to = "/pi-omp.md"
status = 301

# The former /agent-plugin/ doc section was renamed to /agent-plugins/.
[[redirects]]
from = "/agent-plugin"
to = "/agent-plugins/"
status = 301

[[redirects]]
from = "/agent-plugin/"
to = "/agent-plugins/"
status = 301

[[redirects]]
from = "/agent-plugin/compatibility"
to = "/agent-plugins/compatibility/"
status = 301

[[redirects]]
from = "/agent-plugin/compatibility/"
to = "/agent-plugins/compatibility/"
status = 301

[[redirects]]
from = "/agent-plugin.md"
to = "/agent-plugins.md"
status = 301

[[redirects]]
from = "/agent-plugin/compatibility.md"
to = "/agent-plugins/compatibility.md"
status = 301

[build.environment]
NODE_VERSION = "24"
COREPACK_INTEGRITY_KEYS = "0"

[dev]
command = "pnpm --filter @maestria/docs dev"
port = 4321

[[headers]]
for = "/*"
[headers.values]
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' umami.sznm.dev static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com https://raw.githubusercontent.com; font-src 'self'; connect-src 'self' https://umami.sznm.dev https://static.cloudflareinsights.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"
