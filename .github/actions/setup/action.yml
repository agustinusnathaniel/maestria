name: 'Maestria Setup'
description: 'Install dependencies with pnpm, setup Python + ruff, restore vp task cache'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.node-version'
    - uses: actions/setup-python@v5
      with:
        python-version-file: 'packages/hermes/pyproject.toml'
    - name: Install Python checks
      run: pip install ruff
      shell: bash
    - uses: pnpm/setup@v1
      with:
        cache: true
    - name: Restore vp task cache
      id: vite-task-cache
      uses: actions/cache/restore@v6
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vite-task-${{ runner.os }}-${{ runner.arch }}-
    - name: Save vp task cache
      if: success()
      uses: actions/cache/save@v6
      with:
        path: node_modules/.vite/task-cache
        key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
