name: 'maestria Setup'
description: 'Install dependencies with pnpm (which brings Node too)'
inputs:
  save-cache:
    description: 'Save the pnpm store after the job. Only one job per push to main should save it.'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    # Also provides Node, resolved from devEngines.runtime, which is why no setup-node step.
    - uses: pnpm/setup@v3
      with:
        cache: true
        save-cache: ${{ inputs.save-cache }}
        require-lockfile: true
