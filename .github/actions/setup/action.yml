name: 'Maestria Setup'
description: 'Install dependencies with pnpm (which brings Node too), optionally setup Python + ruff, restore vp task cache'
inputs:
  python:
    description: 'Set up Python and install ruff (required for check-python)'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v6
      if: inputs.python == 'true'
      with:
        python-version-file: 'packages/hermes/pyproject.toml'
    - name: Cache pip downloads (ruff wheel)
      if: inputs.python == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: pip-ruff-0.16.7-${{ runner.os }}
    - name: Install Python checks
      if: inputs.python == 'true'
      run: pip install ruff==0.16.7
      shell: bash
    # pnpm/setup installs Node too, resolved from devEngines.runtime, and prepends it to PATH, so
    # it already shadowed the .node-version copy actions/setup-node put there first.
    - uses: pnpm/setup@v3
      with:
        cache: true
        # Fails the job on a missing lockfile independently of the store cache, which while
        # cache: true is on fails first with a less specific error of its own.
        require-lockfile: true
    - name: Restore vp task cache
      uses: actions/cache@v6
      with:
        path: node_modules/.vite/task-cache
        key: vp-task-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          vp-task-cache-${{ runner.os }}-
