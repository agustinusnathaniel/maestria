name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'apps/docs/**'
      - 'docs/**'
      - '.changeset/**'
      - '.maestria/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_GIT_HOOKS: '0'
    steps:
      # Shallow clone: no workflow or build script reads git history.
      # release.yml intentionally keeps fetch-depth 0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version previously resolved from latest.
          bun-version: 1.4.2
      - name: Generate Astro types
        run: pnpm sync:docs
      - name: Check (format + lint + typecheck + test) and Build
        run: pnpm check:ci
      # Docs-only trailing build: check:ci already built packages once via
      # build:ci, so only the Astro docs site remains. Uses the vp-native
      # filter to avoid the pnpm prebuild (check-sync) hook and keep the
      # package build exactly once. Preserves the Astro build coverage
      # previously provided by the merged bun-smoke job.
      - name: Build docs site
        run: pnpm exec vp run --filter @maestria/docs build
      - name: Verify opencode plugin loads in Bun
        run: |
          bun -e "
            const mod = await import('./packages/opencode/dist/index.js');
            const plugin = await mod.MaestriaPlugin({}, {});
            const hooks = Object.keys(plugin).sort().join(',');
            if (hooks !== 'chat.message,config,experimental.session.compacting')
              throw new Error('Unexpected hooks: ' + hooks);
            console.log('OK opencode plugin loaded in Bun: ' + hooks);
          "
