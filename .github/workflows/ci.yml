name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; every main commit keeps its own verification.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VITE_GIT_HOOKS: '0'

# The check jobs run in parallel on separate runners; together they cover
# `pnpm check` plus the docs build and the Bun load check. The `main` ruleset
# requires only `CI Gate`, so PRs that skip the checks can still merge.
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # PRs that only touch these paths skip the checks; Cloudflare Pages builds
      # the docs preview. Pushes to main always run them.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if grep -qvE '^(apps/docs/|docs/|\.changeset/|\.maestria/)' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint and Sync
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Shallow clone: no workflow or build script reads git history.
      # release.yml intentionally keeps fetch-depth 0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - name: Format, sync, build, and type-aware lint
        run: pnpm check:ci:lint

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          # One job saves the pnpm store, from main only; PR runs restore it.
          save-cache: ${{ github.event_name == 'push' }}
      - name: Install Bun
        run: pnpm runtime set bun 1.4.2 -g
      - name: Build and test
        run: pnpm check:ci:test
      - name: Verify opencode plugin loads in Bun
        run: |
          bun -e "
            const { default: plugin } = await import('./packages/opencode/dist/index.js');
            if (plugin.id !== 'maestria' || typeof plugin.effect !== 'function')
              throw new Error('Unexpected plugin definition: ' + JSON.stringify(Object.keys(plugin)));
            console.log('OK opencode plugin loaded in Bun: ' + plugin.id);
          "

  docs:
    name: Docs Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - name: Build docs site
        run: pnpm exec vp run --filter @maestria/docs build

  gate:
    name: CI Gate
    needs: [changes, check, test, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Skipped checks pass; a failed or cancelled job, including change
      # detection, fails the gate.
      - name: Require every job to pass or be skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
