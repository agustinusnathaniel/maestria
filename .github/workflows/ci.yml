name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; every main commit keeps its own verification.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VITE_GIT_HOOKS: '0'

# The jobs run in parallel on separate runners; together they cover `pnpm check`
# plus the docs build and the Bun load check.
jobs:
  check:
    name: Lint and Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 3
      - name: Format, sync, build, and type-aware lint
        run: pnpm check:ci:lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 3
        with:
          # Seeds the pnpm store from main; PR runs only restore it.
          save-cache: ${{ github.event_name == 'push' }}
      - name: Install Bun
        run: pnpm runtime set bun 1.4.2 -g
      - name: Build and test
        run: pnpm check:ci:test
      - name: Verify opencode plugin loads in Bun
        run: |
          bun -e "
            const { default: plugin } = await import('./packages/opencode/dist/index.js');
            if (plugin.id !== 'maestria' || typeof plugin.effect !== 'function')
              throw new Error('Unexpected plugin definition: ' + JSON.stringify(Object.keys(plugin)));
            console.log('OK opencode plugin loaded in Bun: ' + plugin.id);
          "

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 3
      - name: Build docs site
        run: pnpm exec vp run --filter @maestria/docs build
