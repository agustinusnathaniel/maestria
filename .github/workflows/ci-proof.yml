name: CI execution proof

on:
  push:
    branches:
      - codex/ci-execution-proof

permissions:
  contents: read

concurrency:
  group: ci-execution-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    if: github.ref == 'refs/heads/codex/ci-execution-proof' && github.run_attempt <= 3
    name: Pair ${{ github.run_attempt }} / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    env:
      VITE_GIT_HOOKS: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - name: Install Bun
        run: pnpm runtime set bun 1.4.2 -g
      - name: Record environment
        env:
          PROOF_PAIR: ${{ github.run_attempt }}
          PROOF_VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p artifacts/ci-proof
          pnpm exec node -e "const fs = require('node:fs'); fs.writeFileSync('artifacts/ci-proof/environment.json', JSON.stringify({ sha: process.env.GITHUB_SHA, pair: process.env.PROOF_PAIR, variant: process.env.PROOF_VARIANT, platform: process.platform, node: process.version, cpus: require('node:os').availableParallelism() }, null, 2));"
          pnpm --version
          pnpm exec vp --version
          bun --version
          python3 --version
          ruff --version
      - name: Generate Astro types
        if: matrix.variant == 'baseline'
        run: pnpm sync:docs 2>&1 | tee artifacts/ci-proof/baseline-astro.log
      - name: Check (format + lint + typecheck + test) and Build
        if: matrix.variant == 'baseline'
        run: pnpm check:ci 2>&1 | tee artifacts/ci-proof/baseline-check.log
      - name: Build docs site
        if: matrix.variant == 'baseline'
        run: pnpm exec vp run --filter @maestria/docs build 2>&1 | tee artifacts/ci-proof/baseline-docs.log
      - name: Verify opencode plugin loads in Bun
        if: matrix.variant == 'baseline'
        run: |
          bun -e "
            const mod = await import('./packages/opencode/dist/index.js');
            const plugin = await mod.MaestriaPlugin({}, {});
            const hooks = Object.keys(plugin).sort().join(',');
            if (hooks !== 'chat.message,config,experimental.chat.system.transform,experimental.session.compacting')
              throw new Error('Unexpected hooks: ' + hooks);
            console.log('OK opencode plugin loaded in Bun: ' + hooks);
          "
      - name: Run candidate DAG
        if: matrix.variant == 'candidate'
        run: pnpm exec tsx tooling/ci-proof/run.ts
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-proof-${{ github.run_attempt }}-${{ matrix.variant }}-${{ github.sha }}
          path: artifacts/ci-proof/
          retention-days: 3
          if-no-files-found: error
