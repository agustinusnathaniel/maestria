name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'docs/**'

# Scope note: this workflow covers docs-related changes that the main CI
# workflow's paths-ignore skips ('apps/docs/**' and 'docs/**'), so docs-only
# PRs still get a CI signal. The docs-site build also runs for root 'docs/**'
# changes (ADRs, guides) even though those files do not affect the site build;
# GitHub Actions has no simple built-in per-path job conditional, and a
# successful build is a cheap, harmless signal. Root .github/workflows/ci.yml
# path filters are intentionally unchanged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Generate Astro types
        run: pnpm sync:docs
      - name: Build docs site
        run: pnpm --filter @maestria/docs build
