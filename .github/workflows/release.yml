name: Release

on:
  push:
    branches:
      - main
    paths:
      - '.changeset/**'
      - '**/CHANGELOG.md'
      - '**/package.json'
      - '.github/workflows/release.yml'
      - '.vite-hooks/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The release App token pushes the version branch and tags and opens the
# version PR; id-token: npm trusted publishing with provenance.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_GIT_HOOKS: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Verify generated plugins are in sync
        run: pnpm exec vp run check-sync
      - name: Build
        run: pnpm build:ci
      # The version PR and release tags come from the release GitHub App, not
      # GITHUB_TOKEN, so the version PR triggers CI without manual approval.
      - name: Create release App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
